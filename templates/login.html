{% extends 'base.html' %}

{% block content %}
    <section class="form-box">
        <h1 class="form-box__title">Вход в систему</h1>
        <div class="message"></div>
        <form id="loginForm" class="form" method="post" action="/login" novalidate>
            <div class="form__group">
                <label class="form-label" for="login">Логин</label>
                <input class="form-control" id="login" name="login" type="text">
                <div class="form__error"></div>
            </div>
            <div class="form__group">
                <label class="form-label" for="password">Пароль</label>
                <input class="form-control" id="password" name="password" type="password">
                <div class="form__error"></div>
            </div>
            <button class="btn btn-primary button w-100" type="submit">Войти</button>
        </form>
        <p class="form-box__switch">Еще не зарегистрированы? <a href="register.html">Регистрация</a></p>
    </section>
{% endblock %}
