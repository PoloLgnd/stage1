<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Вход - Конференция РФ{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css' ) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css' ) }}">
</head>
<body>
    <!-- Шапка -->
    <header class="header">
        <div class="container header__inner">
            <a class="header__logo" href="/">Конференции.РФ</a>
            <nav class="nav">
                <a class="nav__link" href="/rooms">Мои заявки</a>
                <a class="nav__link" href="/rooms">Новая заявка</a>
                <a class="nav__link" href="/login">Войти</a>
            </nav>
        </div>
    </header>
    <!-- Основное содержимое -->
    <main class="main">
        {% block content %}
            
        {% endblock %}
    </main>
    <!-- Подвал -->
     <footer class="footer">
        <div class="container">
            <p class="footer__text">© 2027 Конференции.РФ</p>
        </div>
    </footer>
</body>
</html>
